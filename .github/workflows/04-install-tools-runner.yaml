name: 04 install tools runner

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  install-tools:

    runs-on: ubuntu-latest

    steps:

      - name: Download Repo in runner
        uses: actions/checkout@v4

      - name: Check node version
        run: node --version

      - name: Install Jsonlint
        run: |
          sudo apt-get update
          sudo apt-get install -y jsonlint

      - name: Install CowSay
        run: |
          sudo apt-get install cowsay
          cowsay -f dragon "Hola Github actions :c"
