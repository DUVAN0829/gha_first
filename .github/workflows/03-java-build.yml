name: 03 java build

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # o 'zulu', 'adopt'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean verify
        working-directory: java-project